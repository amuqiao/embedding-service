[project]
name = "cms-ai-translation-service"
version = "0.1.0"
description = "CMS AI translation service"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.12",
    "taskiq==0.12.4",
    "taskiq-redis==1.1.2",
    "redis==6.4.0",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "litellm==1.88.0",
    "numpy==2.5.0",
    "pillow==12.2.0",
    "typer==0.25.1",
]

[project.optional-dependencies]
audio-triton = [
    "soundfile==0.14.0",
    "tritonclient[http]==2.70.0",
]
audio-separation = [
    "onnxruntime==1.27.0",
    "soundfile==0.14.0",
    "tritonclient[http]==2.70.0",
]

[dependency-groups]
dev = [
    "httpx2==2.5.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]
load = [
    "locust==2.44.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
