version: "1"
models:
  - id: gpt-5.5
    name: GPT-5.5
    provider: openai
    litellm_model: openai/gpt-5.5
    enabled: true
    context_window: 1050000
    supports_json_output: true
    notes: "GPT-5.5 当前需使用默认 temperature=1；不要改为 0.7。"
    requires_env:
      - OPENAI_API_KEY
    generation:
      temperature: 1.0
      num_retries: 0
      drop_params: true

