# Top-level fields are runtime service configuration. Caller-facing metadata lives under public
# and is the only source used by GET /models.
version: "1"
models:
  - id: gpt-5.5
    adapter: litellm
    provider: openai
    provider_model: gpt-5.5
    adapter_model: openai/gpt-5.5
    pricing_ref: openai:gpt-5.5@2026-06-23
    enabled: true
    requires_env:
      - OPENAI_API_KEY
    generation:
      temperature: 1.0
      num_retries: 0
      drop_params: true
    public:
      name: GPT-5.5
      provider: openai
      model_type: text
      capabilities:
        - text_generation
        - multimodal_text_generation
      input_media_types:
        - text/plain
        - image/png
        - image/jpeg
        - image/webp
      output_media_types:
        - text/plain
      limits:
        context_window: 1050000
      features:
        supports_json_output: true
        supports_image_generation_tool: true
      parameters: []
      notes: Default high-capability text generation model.
