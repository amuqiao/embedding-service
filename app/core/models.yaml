version: "1"
models:
  - id: gpt-4o
    name: GPT-4o
    provider: openai
    litellm_model: openai/gpt-4o
    enabled: true
    context_window: 128000
    supports_json_output: true
    notes: ""
    requires_env:
      - OPENAI_API_KEY
    generation:
      temperature: 0.7
      num_retries: 0
      drop_params: true

  - id: gpt-4o-mini
    name: GPT-4o mini
