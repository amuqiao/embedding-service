    provider_model: gpt-5.5
    adapter_model: openai/gpt-5.5
    pricing_ref: openai:gpt-5.5@2026-06-23
    enabled: true
    capabilities:
      - text_generation
    input_media_types:
      - text/plain
    output_media_types:
      - text/plain
    limits:
      context_window: 1050000
    features:
      supports_json_output: true
    parameters:
      public: []
    notes: "Default high-capability text generation model."
    requires_env:
      - OPENAI_API_KEY
    generation:
      temperature: 1.0
      num_retries: 0
      drop_params: true

