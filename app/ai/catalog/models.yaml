  - id: gpt-image-2
    enabled: true
    public:
      name: gpt-image-2
      provider: openai
      model_type: image
      capabilities:
        - image_generation
        - image_edit
      input_media_types:
        - text/plain
        - image/png
        - image/jpeg
        - image/webp
      output_media_types:
        - image/png
        - image/jpeg
        - image/webp
      limits:
        max_output_count: 4
      features:
        native_transparency: false
        supports_edit: true
      parameters:
        - name: n
          label: 数量
          type: integer
          required: false
          min: 1
          max: 4
          default: 1
        - name: size
          label: 尺寸
          type: select
          required: false
          options:
            - auto
            - 1024x1024
            - 1536x1024
            - 1024x1536
          default: auto
        - name: background
          label: 背景
          type: select
          required: false
          options:
            - opaque
            - auto
          default: auto
        - name: quality
          label: 质量
          type: select
          required: false
          options:
            - auto
            - high
            - medium
            - low
          default: auto
        - name: output_format
          label: 格式
          type: select
          required: false
          options:
            - png
            - jpeg
            - webp
          default: png
      notes: ""
    execution:
      routes:
        image_generation:
          adapter: openai_images
          provider: openai
          provider_model: gpt-image-2
          adapter_model: gpt-image-2
          pricing_ref: openai:gpt-image-2@2026-07-02
          requires_env:
            - OPENAI_API_KEY
        image_edit:
          adapter: openai_images
          provider: openai
          provider_model: gpt-image-2
          adapter_model: gpt-image-2
          pricing_ref: openai:gpt-image-2@2026-07-02
          requires_env:
            - OPENAI_API_KEY
