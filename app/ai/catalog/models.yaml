# Top-level fields are runtime service configuration. Caller-facing metadata lives under public
# and is the only source used by GET /models.
version: "2"
default_model_ids:
  text_generation: gpt-5.5
  multimodal_text_generation: gpt-5.5
  image_generation: gpt-image-2
  image_edit: gpt-image-2
models:
  - id: gpt-5.5
    enabled: true
    public:
      name: GPT-5.5
      provider: openai
      model_type: text
      capabilities:
        - text_generation
        - multimodal_text_generation
      input_media_types:
        - text/plain
        - image/png
        - image/jpeg
        - image/webp
      output_media_types:
        - text/plain
      limits:
        context_window: 1050000
      features:
        supports_json_output: true
        supports_image_generation_tool: true
      parameters: []
      notes: Default high-capability text generation model.
    execution:
      routes:
        text_generation:
          adapter: litellm
          provider: openai
          provider_model: gpt-5.5
          adapter_model: openai/gpt-5.5
          pricing_ref: openai:gpt-5.5@2026-06-23
          requires_env:
            - OPENAI_API_KEY
          generation:
            temperature: 1.0
            num_retries: 0
            drop_params: true
        multimodal_text_generation:
          adapter: openai_responses
          provider: openai
          provider_model: gpt-5.5
          adapter_model: gpt-5.5
          pricing_ref: openai:gpt-5.5@2026-06-23
          requires_env:
            - OPENAI_API_KEY

  - id: gpt-5.4
    enabled: true
    public:
