<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job 观测面板</title>
    <link rel="stylesheet" href="/internal/jobs-dashboard/static/dashboard.css" />
    <script src="/internal/jobs-dashboard/static/vendor/echarts.min.js"></script>
    <script defer src="/internal/jobs-dashboard/static/chart_contract.js"></script>
    <script defer src="/internal/jobs-dashboard/static/dashboard.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">JO</div>
        <div>
          <h1>Job 观测面板</h1>
          <p>FastAPI + Taskiq</p>
        </div>
      </div>
      <nav id="section-nav" class="nav" aria-label="面板分区"></nav>
      <div class="side-note">
        只读 internal dashboard。深度排障继续使用 <code>scripts/jobs.sh</code>。
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div>
          <div class="eyebrow">内部路由 internal route</div>
          <h2 id="section-title">总览</h2>
        </div>
        <form id="filters" class="filters">
          <label>
            时间窗口
            <select name="window"></select>
          </label>
          <label>
            调用方 caller_id
            <input name="caller_id" autocomplete="off" placeholder="全部 all" />
          </label>
          <label>
            Job 类型 job_type
            <input name="job_type" autocomplete="off" placeholder="全部 all" />
          </label>
          <label>
            压测轮次 run_id
            <input name="run_id" autocomplete="off" placeholder="全部 all" />
          </label>
          <button id="refresh" class="icon-button" type="submit" title="刷新" aria-label="刷新">↻</button>
        </form>
      </header>

      <section id="status-line" class="status-line" aria-live="polite"></section>

      <section id="view-root" class="section active"></section>
    </main>
  </body>
</html>
