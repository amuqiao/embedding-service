version: 2026-06-10.4
job_types:
  novel_localization.step1_localize:
    name: 本地化
    description: 将中文短篇小说进行本地化改写。
    prompt_blocks:
      system:
        role: system
        label: 系统 Prompt
        content: ''
      user:
        role: user
        label: 用户 Prompt
        content: |-
          短篇本地化有两步，第一步：先用下面这个提示词进行初步本地化：
          # 角色
          你是一位资深的美式通俗小说本地化编辑，拥有10年以上Harlequin、Wattpad Originals等平台的本地化经验。你的任务是将中文短故事进行"文化移植"（Transcreation），而非简单翻译。最终成品应让美国读者完全无法辨识其亚洲来源，认为是地道的美国本土网络小说。

          # 任务
          请参考**小说本地化方法论**，为附件中的**中文短篇小说**进行针对**美国读者**的**本地化处理**，让故事契合美国读者的日常生活、文化背景、价值观，成为原汁原味的美国小说。对于无明显问题的文字保持不变，最终输出完整的、完成本地化处理后的小说，语言是中文。

          # 小说本地化方法论
          ## 【核心原则：不可见本地化】
          - 目标：消除所有"文化指纹"（Cultural Fingerprints）
          - 标准：故事逻辑、情感反应、社会规则必须符合美国主流文化认知
          - 禁区：保留任何需要注释才能理解的文化概念
          - 注意：无需本地化的内容，保留原文无需修改

          ## 【执行流程：三层转换法】
          ### 第一层：世界观重构（Setting Transplantation）
          1. **地理锚定**：
             - 将故事迁移至具体的美国地理坐标（需选择符合原故事气候/城市气质的地点）
             - 替换所有中文地标为美国对应物，保持空间逻辑（如"高架桥堵车"→"Interstate 405堵车"）
             - 社会环境：替换所有中国特色的制度性场所（如民政局→City Hall/Courthouse；派出所→Local PD/Sheriff's Office）

          2. **社会体系适配**：
             - 法律逻辑：婚姻、继承、合同、刑事责任等必须符合美国州法律（默认California/New York，除非有特定需求）
             - 阶层标识：用美国版的社会阶层符号替换
             - 行业文化：如涉及医疗场景应出现Insurance/Co-pay/Copay等概念，急诊室文化而非门诊文化
             - 阶层标识转换：用美国版的社会阶层符号替换，例如
                -学区房 → Good School District + 高Property Tax焦虑
                -公务员 → Federal Employee/Teacher/Union job（强调pension和job security）
                -"暴发户" → Nouveau riche（强调旧钱vs新钱文化）

          注意：小说不是说明文，不要为了本地化而强行把简单的句子改复杂，增加小说阅读成本。如果原来的词不出戏，就可以不改

          ### 第二层：角色系统重建（Character Reconstruction）
          1. **命名策略**（需符合人物阶层与年代）：
             - 主角：使用Top 100美国婴儿名，但避免过于"老外"的名字（如Wang→Ryan/Wyatt；Li→Chloe/Emma）
             - 配角：使用能暗示社会地位的名字（精英→Preston/Whitney；工薪→Danny/Jessica）
             - 姓氏：确保族裔中性（Miller/Smith/Johnson/Jones/Brown），除非特定族裔设定
             - 注意：小说中的人称代词，需要找到对应的角色，替换为角色名的恰当表达（如男主叫做高云旭，本地化后改为Elon Musk；如果小说中有高先生、小高、老高之类的描述，需要根据语境、场合、人物关系选择用Elon Musk、Musk、Elon来替换）

          2. **关系网络美国化**：
             - 亲属称谓：须符合美式文化，例如
               - 公公/婆婆 → Father-in-law / Mother-in-law（直呼其名或Sir/Ma'am也常见）
               - 舅妈/姨妈 → Aunt [名字]（美国不区分父系母系）
               - 表哥/堂弟 → Cousin [名字]（美国无堂表之分）
               - 小名/昵称 → 美式昵称（如"小明"→"Mick", "小红"→"Red"或直接省略）
             - 社交称谓：须符合美式文化，例如
               - 主任/局长 → Manager / Chief / Commissioner / Supervisor（根据具体职能）
               - 老师（非教师职业）→ 不使用，转换为"Sir/Ma'am"或直呼其名
               - 师傅（司机/技工）→ Sir / Driver / 直呼其名
            - 人称代词重构：严格追踪角色名映射：例如若原文"高云旭"映射为"Ethan Miller"，则：
               - 高先生 → Mr. Miller / Sir / Miller（职场）
               - 小高 → Ethan（亲友）/ Miller（上司）
               - 老高 → Old man Miller（亲密调侃）/ Ethan Sr.（父子同场景）
               - 那小子 → That Miller kid / Ethan

          ### 第三层：微观文化元素替换（Cultural Substitution Matrix）
          使用以下对照表进行精确替换，确保文化逻辑一致，更多的文化你需要思考如何替换：

          | 中国元素 | 美国等价物 | 备注 |
          |---------|-----------|------|
          | 微信/短信 | iMessage/Text | 强调已读回执/打字中的文化焦虑不同 |
          | 朋友圈 | Instagram Stories | 公开度与隐私逻辑不同 |
          | 美团/饿了么 | DoorDash/UberEats | 小费文化必须出现 |
          | 白酒 | Whiskey/Beer | 注意饮酒场合的文化差异（Bar vs Home） |
          | 火锅 | BBQ/Bar food | 社交场景的氛围转换 |
          | 彩礼 | Prenup/Dowry（视语境） | 法律与文化概念的谨慎替换 |
          | 学区房 | Good School District | 强调房产税（Property Tax）概念 |
          | 户口 | Citizenship/Green Card | 移民身份焦虑的等效替换 |
          | 春节 | Thanksgiving/Christmas | 家庭团聚功能的等价场景 |
          | 中医/针灸 | Chiropractic/Western Medicine | 注意医疗保险的介入 |

          **特别处理：非等价文化概念**
          - "面子"→转换为"Reputation/Saving face"的美国理解（更强调个人尊严而非集体荣誉）
          - "关系"→转换为"Connections/Network"（弱化人情债，强调功利性互惠）
          - "孝顺"→转换为"Family loyalty"（弱化服从性，强调情感选择）

          ### 第四层: 文风与叙事保护（Narrative Integrity）
          此层为新增，确保不破坏文学性：
          -句法节奏保留：
            原文若使用短促、断续的中文短句（表现焦虑），转换为英文简洁风格（Hemingway-esque），而非复杂从句
            原文若使用长卷轴式描写，保留流动性，避免切成碎片
          -意象系统适配：
            "落叶归根" → "Coming home for Thanksgiving" 或 "Roots in the hometown"
            "雪中送炭" → "Showing up with a six-pack when you're down"（美国等价情感）
            避免机械替换：若"梅花"象征坚韧，转换为"Oak tree"而非强行解释梅花
          -对话逻辑美国化：
            删除中式含蓄（"你吃了吗"开场），转换为美式直接（"We need to talk"）
            保留潜台词（subtext），但转换为美式语境（如用"football game small talk"掩饰尴尬）
            幽默转换：将语言梗（谐音、成语）转换为文化梗（Pop culture reference, Sports reference）

          ### 【质量控制清单】（自检用）
          完成本地化后，必须确认以下零宽容条款：
          [ ] 法律合规性：所有涉及婚姻、财产、犯罪的程序符合目标州现行法律
          [ ] 货币统一：所有金额转换为USD，收入水平符合当地购买力（如"月薪一万人民币"→"月薪4k-5k USD"在Midwest，或"7k USD"在NYC/LA）
          [ ] 无注释需求：没有任何情节需要读者了解中国文化才能理解
          [ ] 称谓一致性：同一场景中，角色称谓符合美国社交距离（如不会突然从"Mr. Smith"跳转到"David"而无过渡）
          [ ] 情感真实性：角色的决策动机符合美国个人主义价值观（如"为了父母牺牲"需转换为"个人选择"或"内疚驱动"）
          [ ] 时代准确性：提及的科技、品牌、流行文化符合设定年代（如2020s不会用Facebook作为主要社交工具）



          # 输出规范
          【本地化后小说正文】
          （完整中文文本，保留原分段与章节结构）

          ---
          【本地化工作注释】（内部审核用，不出现在出版稿）

          **故事类型判定**：Type [A/B/C] - [判定理由]

          **主要角色映射表**：
          - 原：高云旭 → 现：Ethan Miller（映射理由：Top 50名字，80年代出生，中产专业人士）
          - 原：李梅 → 现：Olivia Chen（映射理由：保留姓氏Chen以暗示Type B族裔背景，名字Olivia符合2010s流行）

          **关键场景转换记录**：
          1. [原文] "民政局领证" → [修改] "Courthouse marriage license office"
             [文化理由]：加州领结婚证在County Clerk's office，非民政部门

          2. [原文] "微信红包催婚" → [修改] "Thanksgiving dinner 'when are you giving us grandkids' interrogation"
             [文化理由]：功能等效（家庭压力场景），去除中国特有支付工具

          3. [原文] "高考失利" → [修改] "Failed to get into the dream school, stuck with state university and crushing student loans"
             [文化理由]：美国高等教育焦虑的核心是债务与排名，而非单一考试

          **文风调整说明**：
          - [保留] 原文长句卷轴式环境描写 → 保留流动感
          - [转换] 原对话中的中式客套 → 转换为美式small talk + underlying tension

          **争议处理**：
          - [问题] 原文"为了父母放弃留学"在美版中显得不合逻辑（美国强调个人选择）
          - [解决方案] 转换为"因母亲突发疾病，内疚感（guilt）导致主动放弃offer"，强调个人情感选择而非义务

          **质量检查确认**：[ ] 全部通过 [ ] 部分妥协（说明：____）
      work_note:
        role: user
        label: 已有工作注释 Prompt
        content: ''
    output_contract: |-
      AI 能力层输出格式契约：
      你必须严格使用以下标记输出，标记外不要输出任何解释。

      ===本地化正文开始===
      {完整的本地化后的中文小说正文}
      ===本地化正文结束===

      ===工作注释开始===
      {本次 step1 生成的完整工作注释，包含角色映射、场景转换、文化替换、文风调整、争议处理理由和后续阶段需要继承的连续性规则；如无特殊说明可为空}
      ===工作注释结束===

      硬约束：本地化正文必须是中文稿，不得输出整篇英文译文。
      语义约束：这里的“工作注释”是 step1_localize 的输出 artifact，供业务后端保存、展示、人工编辑，并在 step2/step3 或下一轮 step1 中作为已有工作注释传入；它不是 step2_review 的建议工作注释。
  novel_localization.step2_review:
    name: 本地化校验
    description: 检查本地化结果是否满足要求，并在失败时生成建议工作注释。
    prompt_blocks:
      system:
        role: system
        label: 系统 Prompt
        content: ''
      user:
        role: user
        label: 用户 Prompt
        content: 对你本地化后的小说进行复查，确保1.除了本地化的部分，其相比于原文没有丢失内容也没有增加原文没有的内容；2. 本地化后的小说没有任何属于中国文化特有的元素，比如岳父、伯母这之类的称呼；3.本地化后的小说中所有人物名字和姓氏换成不是很大众的美国人姓名；4.保证当出现A女士、B先生或C夫人这之类的称呼时，A、B和C是这个人物的姓氏；5.保证这篇小说中的人物的言行都是符合美国文化背景的。 如果以上条件都已满足，则回复已满足；如果存在需要修改的地方则呈现出修改后的全文与修改的部分。
      work_note:
        role: user
        label: 当前工作注释 Prompt
        content: ''
    output_contract: |-
      AI 能力层输出格式契约：
      你必须严格使用以下格式输出，标记外不要输出任何解释。

      若校验通过，只输出：
      【校验结论】通过

      若校验不通过，输出：
      【校验结论】不通过

      【问题说明】
      {按优先级列出主要问题，每个问题占一行}

      【建议工作注释】
      {建议追加到下一次 step1 work_note 的工作注释片段}

      不要输出修改后的全文。
      语义约束：这里的“建议工作注释”只在校验不通过时生成，apply_mode=append，由业务后端确认后追加到当前工作注释；不要把它当成 step1 已生成的完整工作注释。
  novel_localization.step3_translate:
    name: 英文翻译
    description: 将本地化后的中文稿翻译为英文。
    prompt_blocks:
      system:
        role: system
        label: 系统 Prompt
        content: ''
      user:
        role: user
        label: 用户 Prompt
        content: |-
          # 中国网络小说翻译专用提示词

          ## 角色设定
          你是一位精通中英双语、专门从事中国网络小说翻译的资深译者。你的目标是将中文网络小说翻译成地道的英文，让英语母语读者感觉像是美国本土作者创作的作品。

          ## 翻译原则

          ### 1. 语言风格适配
          - **避免直译**：不要机械地逐字翻译，而要根据英语表达习惯重新组织语言
          - **语调自然化**：采用符合美国读者阅读习惯的语调和节奏
          - **句式多样化**：混合使用长短句，避免中式英语的单调句式

          ### 2. 故事内容美国化
          - **背景设定**：将故事背景自然地转换为美国环境（城市、学校、社会制度等）
          - **生活细节**：融入美国生活元素（食物、节日、社交方式、流行文化等）
          - **价值观适配**：调整角色的思维方式和价值判断，符合美国文化语境
          - **社会关系**：将中式人际关系转换为美式社交模式

          ### 3. 人名处理（已西化）
          - **保持一致性**：确保人名在全文中保持统一
          - **发音友好**：如遇到生僻西化名字，在翻译中自然融入
          - **称呼习惯**：采用美式称呼习惯（全名、昵称、敬语等）

          ### 4. 情感表达优化
          - **对话自然化**：让角色对话听起来像真正的美国人在说话
          - **情感细腻化**：深化情感描写，符合西方文学的表达方式
          - **幽默本土化**：将中式幽默转换为美式幽默，或选择通用的幽默形式

          ## 具体处理策略

          ### 专有名词处理
          - **人名**：使用已提供的西化人名，确保拼写准确一致
          - **地名**：转换为美国地名或创造符合美国地理特色的虚构地名
          - **机构组织**：使用美式机构名称（如学校、公司、政府部门等）
          - **特殊术语**：根据故事类型适当美国化（如将"功法"转为"techniques"、"宗门"转为"organization"等）

          ### 描写技巧
          - **战斗场面**：使用动感强烈的英语动词和短句
          - **环境描写**：采用简洁直接的描述，避免过度修饰
          - **心理活动**：用口语化的内心独白，贴近真实的思维方式
          - **抒情表达**：避免华丽辞藻和排比句，用朴实自然的语言传达情感

          ### 语言节奏
          - **快节奏情节**：使用短句、强动词，营造紧张感
          - **抒情段落**：保持口语化风格，避免过度文学化和排比句式，使用简洁自然的表达
          - **对话部分**：确保符合美国口语习惯

          ## 防止漏译乱译的质量控制机制

          ### 1. 分段翻译法
          - **逐段处理**：将长文本分段翻译，确保每段都完整处理
          - **标记检查**：翻译完一段后，在原文上做标记，避免遗漏
          - **段落对应**：确保译文段落数量与原文一致

          ### 2. 内容完整性检查
          - **句子数量对比**：检查译文句子数量是否与原文基本对应
          - **关键信息确认**：确保所有重要情节点、对话、描写都已翻译
          - **人名地名核对**：检查所有人名地名是否都已正确翻译且保持一致

          ### 3. 逐句验证流程
          **第一遍：粗译** - 快速翻译全文，重点保证内容完整
          **第二遍：精修** - 逐句检查，优化表达，确保美国化
          **第三遍：查漏** - 对照原文，确认无遗漏、无错译

          ### 4. 关键检查点
          - [ ] 是否有整句或整段被跳过？
          - [ ] 人名是否前后一致？
          - [ ] 对话内容是否完整翻译？
          - [ ] 重要情节转折是否准确传达？
          - [ ] 数字、时间、地点等具体信息是否正确？
          - [ ] 语气和情感是否与原文匹配？

          ### 5. 错误类型预防
          **漏译预防：**
          - 使用行号或段落标记系统
          - 设置翻译进度检查点
          - 完成后进行字数粗略对比

          **乱译预防：**
          - 遇到不确定的表达时，选择保守但准确的翻译
          - 优先保证意思准确，再考虑文学性
          - 对专业术语建立统一的翻译标准

          ## 翻译示例对比

          **避免这样翻译（直译+不完整）：**
          "张伟在学校里成绩很好，老师和同学都很喜欢他。他家境不太好，但是很努力。"
          → "Zhang Wei had good grades at school, teachers and classmates liked him." [漏译后半句]

          **推荐这样翻译（完整+美国化）：**
          → "Michael excelled academically and was well-liked by both teachers and classmates. Despite coming from a modest family background, he worked incredibly hard to succeed."

          **抒情段落处理示例：**

          **避免这样（过度文学化+排比）：**
          "夕阳西下，金辉洒向大地，微风轻抚，鸟儿归巢，一切都显得那么宁静，那么美好，那么令人陶醉。"
          → "The sun set in the west, casting golden light upon the earth, the gentle breeze caressing all, the birds returning to their nests, everything appearing so peaceful, so beautiful, so intoxicating."

          **推荐这样（口语化+自然）：**
          → "The sun was setting, painting everything gold. A light breeze stirred the air as birds headed home. It felt peaceful. Really beautiful, actually."

          ## 质量检查标准
          翻译完成后，问自己：
          1. **完整性检查**：原文的每一句话都翻译了吗？没有遗漏任何内容吗？
          2. **准确性检查**：译文意思与原文一致吗？没有误解或曲解吗？
          3. **美国化程度**：这段英文听起来像是美国作家写的吗？
          4. **可读性检查**：一个从未接触过中国文化的美国读者能理解这段内容吗？
          5. **一致性检查**：人名、地名、术语在全文中保持一致吗？
          6. **情感传达**：情节的紧张感和情感张力是否得到了保持？

          ## 紧急修正机制
          如果发现漏译或错译：
          - **立即停止**：不要继续翻译后续内容
          - **回溯检查**：从错误点向前检查至少3段内容
          - **重新翻译**：对问题段落进行完整重译
          - **全文核查**：完成后对整篇进行一遍完整性检查

          ## 翻译指令
          请严格按照以上原则翻译以下中文网络小说片段。**特别注意**：
          1. 故事背景和内容要完全美国化
          2. 使用已提供的西化人名，保持前后一致
          3. 绝对不能遗漏任何内容，确保翻译完整
          4. 如有疑问，优先保证准确性和完整性
          5. 最终结果应该读起来像美国本土作家的原创小说

          **翻译流程：**
          1. 先通读全文，理解整体内容
          2. 分段翻译，每段完成后做标记
          3. 逐句检查，确保无遗漏
          4. 最后通读译文，进行美国化润色
