services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novel_localize
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novel_localize"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/novel_localize
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-api.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/novel_localize
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
      API_HOST: 0.0.0.0
      API_PORT: "8100"
    ports:
      - "8100:8100"
    volumes:
      - object_storage:/app/storage/objects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-worker.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/novel_localize
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
    volumes:
      - object_storage:/app/storage/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  object_storage:
