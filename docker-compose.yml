name: ${COMPOSE_PROJECT_NAME:-embedding-service}

services:
  postgres:
    # old image: postgres:16-alpine
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${POSTGRES_DB:-embedding_service}
    ports:
      - "${POSTGRES_HOST_PORT:-25440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-26387}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app", "roles"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-api.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
      API_HOST: 0.0.0.0
      API_PORT: "8100"
    ports:
      - "${API_HOST_PORT:-8100}:8100"
    volumes:
      - object_storage:/app/storage/objects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-worker-bundle.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
      WORKER_PROCESSES: ${WORKER_PROCESSES:-1}
      WORKER_MAX_ASYNC_TASKS: ${WORKER_MAX_ASYNC_TASKS:-1}
      WORKER_LOGLEVEL: ${WORKER_LOGLEVEL:-INFO}
    volumes:
      - object_storage:/app/storage/objects
      - ./.data/models:/app/.data/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dispatcher:
    profiles: ["roles"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-dispatcher.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  taskiq-worker:
    profiles: ["roles"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-worker.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      REDIS_URL: redis://redis:6379/0
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
      WORKER_PROCESSES: ${WORKER_PROCESSES:-1}
      WORKER_MAX_ASYNC_TASKS: ${WORKER_MAX_ASYNC_TASKS:-1}
      WORKER_LOGLEVEL: ${WORKER_LOGLEVEL:-INFO}
    volumes:
      - object_storage:/app/storage/objects
      - ./.data/models:/app/.data/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  callbacker:
    profiles: ["roles"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-callbacker.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reconciler:
    profiles: ["roles"]
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    command: ["/app/start-reconciler.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-embedding_service}
      LOCAL_OBJECT_STORAGE_PATH: /app/storage/objects
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  object_storage:
